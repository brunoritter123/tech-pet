version: '3'
services:
  mysql-tech-pet:
    image: mysql:8.0.29
    command: --default-authentication-plugin=mysql_native_password
    container_name: mysql-tech-pet
    volumes:
      - dbmysql-volume:/var/lib/mysql:Z
      - ./dump:/docker-entrypoint-initdb.d:Z
    restart: always
    ports:
      - 3306:3306
    expose:
     - 3306
    environment:
     MYSQL_RANDOM_ROOT_PASSWORD: 1
     MYSQL_USER: mysql
     MYSQL_PASSWORD: 123456
     MYSQL_DATABASE: tech-pet

volumes:
  dbmysql-volume: